<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Account – TimeCraft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #c9a84c;
      --dark: #111111;
      --grey: #f8f9fa;
      --mid: #666666;
      --border: #e8e8e8;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      color: var(--dark);
      background: #fff;
      padding-top: 110px;
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5%; height: 70px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 20px; font-weight: 700; letter-spacing: 2px;
      color: var(--dark); text-decoration: none;
    }
    .nav-logo svg { width: 24px; height: 24px; fill: none; stroke: var(--gold); stroke-width: 6; }

    .nav-links { display: flex; gap: 30px; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--dark); font-weight: 500; font-size: 14px; }
    .nav-links a:hover, .nav-links a.active { color: var(--gold); }

    .nav-actions { display: flex; align-items: center; gap: 25px; }
    .nav-actions a { text-decoration: none; color: var(--dark); font-size: 14px; font-weight: 500; }
    .nav-cart { position: relative; cursor: pointer; text-decoration: none; color: var(--dark); }
    .nav-cart-count {
      position: absolute; top: -10px; right: -12px;
      background: var(--gold); color: #fff;
      font-size: 11px; font-weight: bold;
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── ACCOUNT CONTAINER ── */
    .account-container {
      max-width: 900px;
      margin: 0 auto 60px auto;
      padding: 0 5%;
    }

    .account-header {
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .account-header h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* ── PROFILE CARD ── */
    .profile-card {
      background: var(--grey);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 30px;
      display: flex;
      align-items: center;
      gap: 25px;
      margin-bottom: 40px;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
    }

    .avatar-placeholder {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--dark);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
    }

    .profile-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .profile-name {
      font-size: 20px;
      font-weight: 600;
    }

    .profile-email {
      font-size: 14px;
      color: var(--mid);
    }

    .profile-badge {
      display: inline-block;
      margin-top: 5px;
      font-size: 11px;
      background: rgba(201, 168, 76, 0.15);
      color: var(--gold);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      width: fit-content;
    }

    .logout-btn {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid #d9534f;
      color: #d9534f;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: #d9534f;
      color: #fff;
    }

    /* ── INFO GRID SECTION ── */
    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .info-box {
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 6px;
    }

    .info-box label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--mid);
      letter-spacing: 1px;
      display: block;
      margin-bottom: 6px;
    }

    .info-box p {
      font-size: 15px;
      font-weight: 500;
    }

    /* ── NOT LOGGED IN STATE ── */
    .not-logged-in {
      text-align: center;
      padding: 60px 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .login-btn-redirect {
      padding: 12px 25px;
      background: var(--dark);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    .login-btn-redirect:hover {
      background: var(--gold);
    }

    @media (max-width: 600px) {
      .profile-card {
        flex-direction: column;
        text-align: center;
      }
      .profile-details {
        align-items: center;
      }
      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40"/>
        <line x1="50" y1="50" x2="50" y2="25"/>
        <line x1="50" y1="50" x2="70" y2="50"/>
      </svg>
      TIMECRAFT
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <a href="account.html" class="active" style="color: var(--gold); font-weight: 600;">Account</a>
      <a href="cart.html" class="nav-cart">
        🛒<span class="nav-cart-count" id="cart-count">0</span>
      </a>
    </div>
  </nav>

  <main class="account-container">
    <div class="account-header">
      <h1>My Profile</h1>
    </div>

    <!-- Logged-in Content View -->
    <div id="account-content">
      <div class="profile-card">
        <div id="avatar-container"></div>
        <div class="profile-details">
          <h2 class="profile-name" id="user-name">Loading...</h2>
          <p class="profile-email" id="user-email">email@example.com</p>
          <span class="profile-badge" id="user-badge">Verified Member</span>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <h3 class="section-title">Account Details</h3>
      <div class="info-grid">
        <div class="info-box">
          <label>Full Name</label>
          <p id="detail-name">-</p>
        </div>
        <div class="info-box">
          <label>Email Address</label>
          <p id="detail-email">-</p>
        </div>
        <div class="info-box">
          <label>Authentication Provider</label>
          <p id="detail-provider">-</p>
        </div>
        <div class="info-box">
          <label>Account Status</label>
          <p style="color: #2e7d32;">● Active</p>
        </div>
      </div>
    </div>

    <!-- Fallback if user is not signed in -->
    <div class="not-logged-in" id="not-logged-in">
      <h2>You are not signed in</h2>
      <p>Please log in to access your profile information.</p>
      <a href="login.html" class="login-btn-redirect">Go to Login Page</a>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      updateCartCount();
      loadUserProfile();
    });

    function loadUserProfile() {
      const userRaw = localStorage.getItem("timecraft_user");
      const isLoggedIn = localStorage.getItem("isLoggedIn");
      const accountContent = document.getElementById("account-content");
      const notLoggedIn = document.getElementById("not-logged-in");

      if (!userRaw || isLoggedIn !== "true") {
        accountContent.style.display = "none";
        notLoggedIn.style.display = "flex";
        return;
      }

      const user = JSON.parse(userRaw);

      // Populate text info
      document.getElementById("user-name").textContent = user.name || "TimeCraft Member";
      document.getElementById("user-email").textContent = user.email || "No email available";
      document.getElementById("detail-name").textContent = user.name || "N/A";
      document.getElementById("detail-email").textContent = user.email || "N/A";

      // Dynamic Auth Provider & Badge handling
      const provider = user.provider || (user.picture ? 'Google OAuth 2.0' : 'Email Registration');
      document.getElementById("detail-provider").textContent = provider;
      document.getElementById("user-badge").textContent = user.picture ? "Google Verified Member" : "TimeCraft Member";

      // Render Avatar or Initial Letter
      const avatarContainer = document.getElementById("avatar-container");
      if (user.picture) {
        avatarContainer.innerHTML = `<img src="${user.picture}" alt="${user.name}" class="profile-avatar"/>`;
      } else {
        const initial = user.name ? user.name.charAt(0).toUpperCase() : "U";
        avatarContainer.innerHTML = `<div class="avatar-placeholder">${initial}</div>`;
      }
    }

    function logout() {
      // Clear user session from storage completely
      localStorage.removeItem("timecraft_user");
      localStorage.setItem("isLoggedIn", "false");
      window.location.href = "index.html";
    }

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('timecraft_cart') || '[]');
      const count = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
      document.getElementById('cart-count').textContent = count;
    }
  </script>
</body>
</html>
